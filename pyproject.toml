# Code style: Google Python Style Guide. pyink (Google's fork of black) formats, isort orders the imports.
# Development tooling only: the app is installed from requirements.txt and run with uvicorn.
#   pip install pyink isort pylint
#   python -m isort app scripts tests smoke_test.py
#   python -m pyink app scripts tests smoke_test.py
#   python -m pylint --rcfile=pylintrc app scripts

[tool.pyink]
line-length = 80
pyink-indentation = 4
pyink-use-majority-quotes = true
target-version = ["py310"]

[tool.isort]
profile = "google"
line_length = 80
known_first_party = ["app", "scripts"]
